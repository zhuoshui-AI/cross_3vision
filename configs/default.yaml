# Multimodal Swin-DETR default config

# ---- Data ----
data:
  # data_root 可省略：当 train_split 是绝对目录时，直接用它当 data_root
  train_split: "/HUBU-AI027/AIdemo/训练集/AIC2026_Train_2000"
  # val_split 不填 = 从训练集按 val_ratio 切出验证集（测试集无标注，不适合做 val）
  # val_split: "/HUBU-AI027/AIdemo/测试集/AIC2026_PHASE_1_1000"
  val_ratio: 0.1                # 从训练集切 10% 当 val（2000 张 → 200 val）
  test_split: "/HUBU-AI027/AI_competition/data/AIC2026_PHASE_2_1000"  # 复赛测试集，仅 inference 用
  img_size: 512                # 训练/推理统一边长（Swin 下采样 32x → 特征图 16x16）
  num_workers: 8

# ---- Model ----
model:
  # 架构开关：rgbir_resnet = RGB+IR 4通道拼接 ResNet50 + 深度交叉注意力（本分支默认）；
  #          tri_swin = TMSC-Det（三 Swin + HCMAF + FPN）；cssa_detr = 旧结构
  arch: "rgbir_resnet"

  # ---- rgbir_resnet 配置 ----
  resnet_variant: "resnet50_imagenet_4ch"        # 4 通道适配版 ResNet50
  resnet_pretrained_path: "./weights/resnet50-11ad3fa6.pth"  # 本地 ImageNet 权重
  resnet_freeze_stages: 1                        # 冻结 layer1（适配后的 conv1 保持可训练）
  depth_fuse_heads: 8                            # 深度交叉注意力头数
  depth_fuse_dropout: 0.0                        # 0 = train/eval 前向完全一致（小数据集更稳）
  # FPN（P3/P4/P5, stride 8/16/32）中送入 DETR encoder 的层级。
  # 实验证据：单尺度 stride-32 时训练集 cardinality error 长期 ≈4.5 压不下去
  # ——极小目标在 stride-32 上不足一个 cell，是漏检的结构性根源。
  # 三层全开（512 输入 ≈ 4096+1024+256 = 5376 token，注意力显存随平方增长，
  # 显存不足就减 batch_size 加 grad_accum）；砍成 [16, 32] 时 P3 细节仍会
  # 经 PAN bottom-up 通路汇入 P4/P5。
  rgbir_encoder_scales: [8, 16, 32]

  # COCO 预训练 DETR 头热启动（小数据集关键 recipe）：
  # vanilla DETR 从零训练需 ~3500 万张图，本数据集 150 epoch 只有 27 万张。
  # facebook/detr-resnet-50 的 encoder/decoder/bbox_predictor 与我们维度完全一致，
  # 直接继承 COCO 定位先验，把"从零学检测"变成"微调"。
  # 权重已通过 git-lfs 随仓库分发（weights/detr-resnet-50-coco/），离线可用；
  # 置空（null）则禁用热启动
  detr_warm_start: "./weights/detr-resnet-50-coco"

  # ---- TMSC-Det (tri_swin) Lite 配置：三路全部 Swin-T ----
  tri_rgb_variant: "swin_tiny_patch4_window7_224"
  tri_ir_variant: "swin_tiny_patch4_window7_224"
  tri_depth_variant: "swin_tiny_patch4_window7_224"
  tri_pretrained_tag: "ms_in22k"          # timm ImageNet-22k 权重标签
  tri_rgb_pretrained_path: "weights/swin_tiny_patch4_window7_224_22k.pth"
  tri_ir_pretrained_path: "weights/swin_tiny_patch4_window7_224_22k.pth"
  tri_depth_pretrained_path: "weights/swin_tiny_patch4_window7_224_22k.pth"
  tri_freeze_stages: 2                    # RGB/IR 冻结前 2 stage
  tri_depth_freeze_stages: 1              # Depth 只冻 1 stage（几何模态差异大）
  tri_fuse_stages: [2, 3, 4]              # 在 stage2/3/4（stride 8/16/32）做 HCMAF
  tri_window_size: 8                      # 联合窗口注意力窗大小（特征尺度均被 8 整除）
  tri_modality_dropout: 0.1               # 训练随机遮蔽整路模态，提升单模退化鲁棒性
  tri_drop_path_rate: 0.0
  tri_fpn_scales: [8, 16, 32]             # FPN 输出 P3/P4/P5（供参考，实际由 fuse_stages 决定）
  # DETR encoder 只吃 P4/P5（共 1280 token@512）；FPN 含 PAN 自底向上通路，
  # P3 的小目标细节会汇入 P4/P5，HCMAF 各级门控均能收到梯度
  tri_encoder_scales: [16, 32]
  # 显存充裕（≥40GB）可改 [8, 16, 32] 让 encoder 直接看 P3（约 5376 token，显存随平方增长）

  # RGB backbone (Swin Transformer, ImageNet-22k pretrained)
  swin_variant: "swin_small_patch4_window7_224"   # timm name (new timm dropped the _22k suffix; ImageNet-22k weights come via pretrained=True / pretrained_path)
  swin_out_stage: 3                                   # 取 stage3 (stride 32)
  swin_freeze_stages: 2                               # 前 2 stage 冻结
  swin_drop_path_rate: 0.0                            # 0 = 关闭 DropPath，保证 train/eval 前向一致（小数据集更稳）
  swin_pretrained: true                              # 训练时从 timm hub 拉权重（构造时默认关闭以免联网）
  swin_pretrained_tag: "ms_in22k"                     # timm tag → ImageNet-22k 权重
  swin_pretrained_path: "./weights/swin_small_patch4_window7_224_22k.pth"  # 离线权重；存在则优先用，不存在则走 hub

  # IR backbone
  ir_backbone: "resnet50_imagenet_1ch"                 # fallback；"anythermal" 切换到 AnyThermal
  ir_pretrained_path: "./weights/resnet50-11ad3fa6.pth"  # resnet50_v2 本地权重（离线用）；anythermal 时指向其权重

  # DETR head
  num_labels: 12
  num_queries: 100
  d_model: 256
  encoder_layers: 6
  decoder_layers: 6
  auxiliary_loss: true
  # 正则化（治过拟合）：10-01 实验显示 val CE 从 ep21 起回升（0.62→0.80）、
  # train CE 0.16（5 倍差），42.6M 参数 vs 1800 张图必须开 dropout。
  # 与 DETR 原论文一致（attention dropout 0.1 + FFN dropout 0.1）。
  detr_dropout: 0.1
  detr_attention_dropout: 0.1
  detr_activation_dropout: 0.0

  # Fusion
  cssa_tau: 0.5                 # 通道切换阈值，固定不学
  cssa_reduction: 16             # 通道评分 1D conv reduction
  depth_fuse_heads: 8

# 12-class label map
id2label:
  0: "person"
  1: "boat"
  2: "animal"
  3: "seat"
  4: "sign"
  5: "bicycle"
  6: "car"
  7: "ball"
  8: "light"
  9: "garbage_can"
  10: "uav"
  11: "tricycle"

# ---- Training ----
train:
  epochs: 150
  batch_size: 8
  grad_accum: 2                  # 等效 batch 16
  optimizer: "adamw"
  lr: 1.0e-4
  weight_decay: 5.0e-4               # 1e-4 → 5e-4：对抗过拟合（val loss U 型回升）
  backbone_lr: 1.0e-5           # Swin/IR backbone 微调 lr
  scheduler: "cosine"
  warmup_steps: 1000
  grad_clip: 0.1
  amp: true                      # bf16/fp16
  label_smoothing: 0.1
  ema_decay: 0.9997             # 设 0 关闭
  log_dir: "./outputs/logs"
  ckpt_dir: "./outputs/ckpt"
  val_interval: 5

# Loss weights (DETR 默认)
loss:
  loss_ce: 1.0
  loss_bbox: 5.0
  loss_giou: 2.0

# ---- Inference ----
inference:
  conf_threshold: 0.0           # 0 = 保留全部 100 个 query 预测（mAP 评测按置信度排序，低分框不拉低精度）
  max_dets_per_image: 100       # 赛题上限，超出按置信度截断
  output_dir: "./outputs/predictions_phase2"   # phase_2 复赛输出，避免覆盖 phase_1
