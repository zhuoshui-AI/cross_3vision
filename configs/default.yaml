# Multimodal Swin-DETR default config

# ---- Data ----
data:
  # data_root 可省略：当 train_split 是绝对目录时，直接用它当 data_root
  train_split: "/HUBU-AI027/AIdemo/训练集/AIC2026_Train_2000"
  # val_split 不填 = 从训练集按 val_ratio 切出验证集（测试集无标注，不适合做 val）
  # val_split: "/HUBU-AI027/AIdemo/测试集/AIC2026_PHASE_1_1000"
  val_ratio: 0.1                # 从训练集切 10% 当 val（2000 张 → 200 val）
  test_split: "/HUBU-AI027/AI_competition/data/AIC2026_PHASE_2_1000"  # 复赛测试集，仅 inference 用
  img_size: 640                # 训练/推理统一边长（Swin 下采样 32x → 特征图 16x16）
  num_workers: 8

# ---- Model ----
model:
  # 架构开关：rgbir_swin = RGB+IR 4通道拼接 Swin-T(22k) + 深度交叉注意力（默认）；
  #          tri_swin = TMSC-Det（三塔 + HCMAF + FPN，IR 塔可切 AnyThermal）；
  #          cssa_detr = 旧结构（Swin-S + CSSA 融合，仅保留参考）
  arch: "rgbir_swin"

  # ---- rgbir_swin：4 通道 Swin 早期融合（替代已删除的 rgbir_resnet）----
  # patch_embed 适配 4 通道：前 3 通道保留预训练 RGB 权重，第 4 通道（IR
  # 灰度）取 RGB 三组权重均值（与旧 ResNet 版 conv1 适配同策略）；
  # 适配后的 patch_embed 保持可训练。C1~C4(96/192/384/768 @ 4/8/16/32)
  # → SimpleFPN → P2~P5。
  rgbir_swin_variant: "swin_tiny_patch4_window7_224"
  rgbir_swin_pretrained_path: "weights/swin_tiny_patch4_window7_224_22k.pth"
  rgbir_swin_freeze_stages: 2          # 冻结前 2 stage
  # 深度交叉注意力（P5 注入），tri_swin/cssa_detr 分支共用这两个键
  depth_fuse_heads: 8
  depth_fuse_dropout: 0.0              # 0 = train/eval 前向完全一致（小数据集更稳）
  # FPN（P2~P5, stride 4/8/16/32）中送入 DETR encoder 的层级。
  # 实验证据：单尺度 stride-32 时训练集 cardinality error 长期 ≈4.5 压不下去
  # ——极小目标在 stride-32 上不足一个 cell，是漏检的结构性根源；
  # w≈0.02 的目标（如 4×9px@192）连 stride-8 都不足一个 cell，故加入 stride-4。
  # 四层全开（640 输入 = 160²+80²+40²+20² = 33800 token）必须搭配模型内的
  # SDPA 注意力（O(N) 显存）；eager 注意力单层矩阵 ~26GB 必爆 24GB。
  # 显存吃紧可降级：[8,16,32]=5376 token，[16,32]=1280 token，
  # 被砍层级的细节仍经 PAN bottom-up 通路汇入保留层级。
  rgbir_encoder_scales: [4, 8, 16, 32]

  # COCO 预训练 DETR 头热启动（小数据集关键 recipe）：
  # vanilla DETR 从零训练需 ~3500 万张图，本数据集 150 epoch 只有 27 万张。
  # facebook/detr-resnet-50 的 encoder/decoder/bbox_predictor 与我们维度完全一致，
  # 直接继承 COCO 定位先验，把"从零学检测"变成"微调"。
  # 权重已离线保存在 weights/detr-resnet-50-coco/；置空（null）则禁用热启动
  detr_warm_start: "./weights/detr-resnet-50-coco"

  # ---- TMSC-Det (tri_swin)：按模态信息量分配容量 ----
  # IR（单通道热图）与 Depth（几何量）信息量远低于 RGB，等容量 Swin-T（28.3M×3）
  # 属过参数化、易过拟合；此处按信息量裁剪每阶 block 数。通道维 96/192/384/768
  # 与 stride 4/8/16/32 保持不变 → HCMAF / FPN 零改动；保留下来的 block 仍可
  # 完整加载 ImageNet-22k 预训练权重（被裁掉的 block 键会被自动忽略）。
  # IR 塔形态："swin"（默认，下列 tri_ir_* 配置生效）或 "anythermal"
  # （DINOv2 蒸馏 ViT-B/14 热红外基础模型，theairlabcmu/AnyThermal）。
  # anythermal 需先运行 scripts/download_pretrained.sh WITH_ANYTHERMAL=1
  # 下载权重；ViT 主体整体冻结，仅训练逐层 1x1 投影，
  # tri_ir_variant / tri_ir_depths / tri_ir_freeze_stages 对其无效。
  tri_ir_backbone: "swin"
  tri_ir_anythermal_path: "./weights/AnyThermal"
  tri_rgb_variant: "swin_tiny_patch4_window7_224"
  tri_ir_variant: "swin_tiny_patch4_window7_224"
  tri_depth_variant: "swin_tiny_patch4_window7_224"
  tri_rgb_depths: [2, 2, 6, 2]            # RGB：完整 Swin-T（28.3M，信息量最大，保精度）
  tri_ir_depths: [1, 1, 2, 2]             # IR：28.3M → 20.6M
  tri_depth_depths: [1, 1, 2, 1]          # Depth：28.3M → 13.5M（三路主干合计 85M → 62M）
  tri_pretrained_tag: "ms_in22k"          # timm ImageNet-22k 权重标签
  tri_rgb_pretrained_path: "weights/swin_tiny_patch4_window7_224_22k.pth"
  tri_ir_pretrained_path: "weights/swin_tiny_patch4_window7_224_22k.pth"
  tri_depth_pretrained_path: "weights/swin_tiny_patch4_window7_224_22k.pth"
  tri_freeze_stages: 2                    # RGB 冻结前 2 stage
  tri_ir_freeze_stages: 3                 # IR 冻结前 3 stage，只训最后 stage（抑制过拟合）
  tri_depth_freeze_stages: 3              # Depth 同上（几何模态，更依赖通用底层特征）
  # 在 stage1/2/3/4（stride 4/8/16/32）做 HCMAF
  # 新增 stage1 → stride-4 特征让 DETR encoder 能直接看到极小目标
  tri_fuse_stages: [1, 2, 3, 4]
  tri_window_size: 8                      # 联合窗口注意力窗大小（特征尺度均被 8 整除）
  tri_modality_dropout: 0.1               # 训练随机遮蔽整路模态，提升单模退化鲁棒性
  tri_drop_path_rate: 0.0
  tri_fpn_scales: [4, 8, 16, 32]          # FPN 输出 P2/P3/P4/P5（参考值，实际由 fuse_stages 决定）
  # DETR encoder 吃 P2/P3/P4/P5 四层（stride 4/8/16/32）
  # 640 输入：160²+80²+40²+20² = 33800 token（SDPA 注意力下 24GB 可训）
  # 显存吃紧可降级：[8,16,32]=5376 token，[16,32]=1280 token
  tri_encoder_scales: [4, 8, 16, 32]

  # ---- cssa_detr（旧结构，仅保留参考）----
  # RGB backbone (Swin Transformer, ImageNet-22k pretrained)
  swin_variant: "swin_small_patch4_window7_224"   # timm name (new timm dropped the _22k suffix; ImageNet-22k weights come via pretrained=True / pretrained_path)
  swin_out_stage: 3                                   # 取 stage3 (stride 32)
  swin_freeze_stages: 2                               # 前 2 stage 冻结
  swin_drop_path_rate: 0.0                            # 0 = 关闭 DropPath，保证 train/eval 前向一致（小数据集更稳）
  swin_pretrained: true                              # 训练时从 timm hub 拉权重（构造时默认关闭以免联网）
  swin_pretrained_tag: "ms_in22k"                     # timm tag → ImageNet-22k 权重
  swin_pretrained_path: "./weights/swin_small_patch4_window7_224_22k.pth"  # 离线权重；存在则优先用，不存在则走 hub

  # IR backbone（cssa_detr 用）
  ir_backbone: "resnet50_imagenet_1ch"                 # fallback；"anythermal" 切换到 AnyThermal
  ir_pretrained_path: "./weights/resnet50-11ad3fa6.pth"  # resnet50_v2 本地权重（离线用）；anythermal 时指向其权重

  # DETR head
  num_labels: 12
  num_queries: 100
  d_model: 256
  encoder_layers: 6
  decoder_layers: 6
  auxiliary_loss: true
  # 正则化（治过拟合）：10-01 实验显示 val CE 从 ep21 起回升（0.62→0.80）、
  # train CE 0.16（5 倍差），42.6M 参数 vs 1800 张图必须开 dropout。
  # 与 DETR 原论文一致（attention dropout 0.1 + FFN dropout 0.1）。
  detr_dropout: 0.1
  detr_attention_dropout: 0.1
  detr_activation_dropout: 0.0

  # Fusion（cssa_detr 用）
  cssa_tau: 0.5                 # 通道切换阈值，固定不学
  cssa_reduction: 16             # 通道评分 1D conv reduction

# 12-class label map
id2label:
  0: "person"
  1: "boat"
  2: "animal"
  3: "seat"
  4: "sign"
  5: "bicycle"
  6: "car"
  7: "ball"
  8: "light"
  9: "garbage_can"
  10: "uav"
  11: "tricycle"

# ---- Training ----
train:
  epochs: 600
  batch_size: 1
  grad_accum: 16                 # 等效 batch 16（与原 8×2 保持一致，避免收敛行为突变）
  optimizer: "adamw"
  lr: 1.0e-4
  weight_decay: 5.0e-4               # 1e-4 → 5e-4：对抗过拟合（val loss U 型回升）
  backbone_lr: 1.0e-5           # Swin/IR backbone 微调 lr
  scheduler: "cosine"
  warmup_steps: 1000
  grad_clip: 0.1
  amp: true                      # bf16/fp16
  label_smoothing: 0.1
  ema_decay: 0.9997             # 设 0 关闭
  log_dir: "./outputs/logs"
  ckpt_dir: "./outputs/ckpt"
  val_interval: 5
  # ---- 早停（监控验证 mAP@50-95）----
  # early_stop_patience: 连续 N 次验证（每 val_interval 个 epoch 一次）无显著
  #                      提升则停训；0 = 关闭
  # early_stop_min_delta: 提升幅度超过该值才算"显著提升"
  early_stop_patience: 0
  early_stop_min_delta: 0.0

# Loss weights (DETR 默认)
loss:
  loss_ce: 1.0
  loss_bbox: 5.0
  loss_giou: 2.0

# ---- Inference ----
inference:
  conf_threshold: 0.0           # 0 = 保留全部 100 个 query 预测（mAP 评测按置信度排序，低分框不拉低精度）
  max_dets_per_image: 100       # 赛题上限，超出按置信度截断
  output_dir: "./outputs/predictions_phase2"   # phase_2 复赛输出，避免覆盖 phase_1
